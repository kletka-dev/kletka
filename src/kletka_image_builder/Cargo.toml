[package]
name = "kletka_image_builder"
edition.workspace = true
version.workspace = true

[[bin]]
name = "kletka-image-builder"
path = "src/main.rs"

[dependencies]
kletka = { path = "../kletka" }
kletka_types = { path = "../kletka_types" }
jiff = { workspace = true }
kube = { version = "5.1.0", features = ["client", "config"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
