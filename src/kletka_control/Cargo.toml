[package]
name = "kletka_control"
edition.workspace = true
version.workspace = true

[[bin]]
name = "kletka-control"
path = "src/main.rs"

[lib]
name = "kletka_control"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
kletka_types = { path = "../kletka_types" }
argon2 = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
kube = { version = "5.1.0", features = ["client", "config", "runtime"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
tower = { workspace = true }

[features]
pg-tests = []

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
tokio-tungstenite = { workspace = true }
kletka_control = { path = ".", features = ["pg-tests"] }
