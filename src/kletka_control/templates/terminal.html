<!DOCTYPE html>
<html lang="en">
<head>
{% let page_title = vm.name %}
{% include "_head.html" %}
<link rel="stylesheet" href="/assets/xterm.min.css">
<script src="/assets/xterm.min.js"></script>
<script src="/assets/xterm-addon-fit.min.js"></script>
</head>
<body class="min-h-screen bg-[#05080a] font-mono text-slate-200 antialiased">
{% let active = "vms" %}
{% include "_nav.html" %}
<main class="mx-auto max-w-[1400px] px-4 py-10 sm:px-10">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3">
      <a href="/vms/{{ vm.id }}" class="inline-flex items-center gap-2 text-sm text-slate-500 transition-colors hover:text-white">
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
        {{ vm.name }}
      </a>
      {% if vm.status == "running" %}
      <span class="pill bg-emerald-400/10 text-emerald-300"><span class="pill-dot bg-emerald-400"></span>connected</span>
      {% else %}
      <span class="pill bg-amber-400/10 text-amber-300"><span class="pill-dot bg-amber-400"></span>{{ vm.status }}</span>
      {% endif %}
    </div>
    <div class="flex items-center gap-3">
      <label class="flex cursor-pointer items-center gap-1.5 text-xs text-slate-400"><input id="serial" type="checkbox" class="accent-red-500"{% if vm.status != "running" %} checked{% endif %}>serial</label>
      <button id="reconnect" class="btn btn-ghost btn-sm">Reconnect</button>
    </div>
  </div>

  <div id="term" class="mt-4 overflow-hidden rounded-xl border border-[#1c2429]" style="height: max(320px, calc(100vh - 9.5rem)); background: #05080a"></div>
</main>
<script>
const VM_ID = "{{ vm.id }}";
const el = document.getElementById('term');
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  lineHeight: 1.15,
  fontFamily: '"JetBrains Mono", ui-monospace, Menlo, monospace',
  theme: {
    background: '#05080a',
    foreground: '#c9d4dc',
    cursor: '#e5484d',
    cursorAccent: '#05080a',
    selectionBackground: '#7f2b2f',
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(el);
fit.fit();
const enc = new TextEncoder(), dec = new TextDecoder();
let ws = null;
const BOOTING = {% if vm.status != "running" %}true{% else %}false{% endif %};
let attempts = 0, backoffMs = 1000, gotData = false, retryTimer = null;
const MAX_ATTEMPTS = 12;
function wsUrl(path) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return proto + '//' + location.host + path;
}
function connect() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (ws) { try { ws.close(); } catch {} }
  gotData = false;
  const serial = document.getElementById('serial').checked;
  term.writeln('connecting…');
  ws = new WebSocket(wsUrl('/v1/vms/' + VM_ID + '/console'));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    term.writeln('connected (serial=' + serial + ')');
    if (serial) term.writeln('(serial console: fixed geometry — untick "serial" and Reconnect for the resizable ssh console)');
    if (!serial && BOOTING) term.writeln('(ssh console needs the guest fully booted; the serial console attaches earlier — press Enter if the screen looks blank)');
    ws.send(JSON.stringify({ kind: 'console', serial: serial, pty_cols: term.cols, pty_rows: term.rows, term: 'xterm-256color', colorterm: 'truecolor' }));
  };
  ws.onmessage = (ev) => {
    gotData = true;
    if (typeof ev.data === 'string') { term.write(ev.data); }
    else { term.write(dec.decode(ev.data)); }
  };
  ws.onclose = (ev) => {
    const why = ev.reason ? ' — ' + ev.reason : '';
    if (!gotData && attempts < MAX_ATTEMPTS) {
      attempts++;
      const wait = Math.round(backoffMs / 1000);
      term.writeln('\r\n[vm not reachable yet' + (why || ' — it may still be booting') + '; retry ' + attempts + '/' + MAX_ATTEMPTS + ' in ' + wait + 's]');
      retryTimer = setTimeout(() => { backoffMs = Math.min(backoffMs * 2, 15000); connect(); }, backoffMs);
      return;
    }
    term.writeln('\r\n[disconnected' + why + ' — Reconnect to resume]');
  };
  term.onData((d) => { if (ws && ws.readyState === 1) ws.send(enc.encode(d)); });
  let warnedSerialResize = false;
  window.onresize = () => {
    fit.fit();
    if (!ws || ws.readyState !== 1) return;
    if (document.getElementById('serial').checked) {
      if (!warnedSerialResize) {
        warnedSerialResize = true;
        term.writeln('\r\n[serial consoles cannot resize — untick "serial" and Reconnect for the ssh console]');
      }
      return;
    }
    ws.send(JSON.stringify({ pty_cols: term.cols, pty_rows: term.rows }));
  };
}
document.getElementById('reconnect').onclick = () => { attempts = 0; backoffMs = 1000; connect(); };
connect();
</script>
  </div>
</div>
</body>
</html>
