<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kletka — login</title>
<script src="/assets/tailwind.js"></script>
<script src="/assets/htmx.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center">
<div class="bg-white shadow rounded p-8 w-full max-w-sm">
  <h1 class="text-2xl font-bold mb-1">kletka</h1>
  <p class="text-sm text-gray-500 mb-6">Log in to manage your VMs</p>
  {% if error.is_some() %}
  <div class="bg-red-100 text-red-700 text-sm rounded px-3 py-2 mb-4">{{ error.as_deref().unwrap_or("") }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-3">
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username"
        class="w-full border rounded px-3 py-2 text-sm" placeholder="you@example.com">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
        class="w-full border rounded px-3 py-2 text-sm" placeholder="••••••••">
    </div>
    <button type="submit" class="w-full bg-black text-white rounded px-3 py-2 text-sm font-medium">Log in</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">No account? <a class="underline" href="/register">Register</a></p>
</div>
</body>
</html>
