name: Release build

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    name: Build and upload CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cli-${{ matrix.name }}
          save-if: false

      - name: Build and package the CLI
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in ${TARGETS//,/ }; do
            cargo build --release -p kletka_cli --bin kletka --target "$target"
            case "$target" in
              x86_64-unknown-linux-gnu) label=x86_64-linux ;;
              aarch64-apple-darwin) label=aarch64-macos ;;
              x86_64-apple-darwin) label=x86_64-macos ;;
              *) echo "no archive label for $target" >&2; exit 1 ;;
            esac
            archive="kletka-${TAG}-${label}.tar.gz"
            tar czf "$archive" -C "target/$target/release" kletka
            shasum -a 256 "$archive" > "$archive.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: kletka-${{ github.event.release.tag_name }}-${{ matrix.name }}
          path: kletka-*.tar.gz*

      - name: Attach CLI to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kletka-*.tar.gz
            kletka-*.tar.gz.sha256

  images:
    name: Build and push container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: imgtags
        run: |
          tag="${{ github.event.release.tag_name }}"
          minor="${tag%.*}"
          major="${minor%.*}"
          base="ghcr.io/${IMAGE_OWNER}"
          api="$base/kletka-api"
          agent="$base/kletka-vm-agent"
          builder="$base/kletka-image-builder"
          api_tags="$api:$tag"
          agent_tags="$agent:$tag"
          builder_tags="$builder:$tag"
          case "$tag" in
            *-*) ;;
            *)
              api_tags="$api_tags"$'\n'"$api:$minor"$'\n'"$api:$major"$'\n'"$api:latest"
              agent_tags="$agent_tags"$'\n'"$agent:$minor"$'\n'"$agent:$major"$'\n'"$agent:latest"
              builder_tags="$builder_tags"$'\n'"$builder:$minor"$'\n'"$builder:$major"$'\n'"$builder:latest"
              ;;
          esac
          {
            echo "api_tags<<EOF"
            echo "$api_tags"
            echo "EOF"
            echo "agent_tags<<EOF"
            echo "$agent_tags"
            echo "EOF"
            echo "builder_tags<<EOF"
            echo "$builder_tags"
            echo "EOF"
            echo "version=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push kletka-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: ${{ steps.imgtags.outputs.api_tags }}
          build-args: |
            KLETKA_VERSION=${{ steps.imgtags.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.imgtags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-images

      - name: Build and push kletka-vm-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: vm-agent
          push: true
          tags: ${{ steps.imgtags.outputs.agent_tags }}
          build-args: |
            KLETKA_VERSION=${{ steps.imgtags.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.imgtags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-images

      - name: Build and push kletka-image-builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: image-builder
          push: true
          tags: ${{ steps.imgtags.outputs.builder_tags }}
          build-args: |
            KLETKA_VERSION=${{ steps.imgtags.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.imgtags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-images

  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      - name: Compute lowercase owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Package and push
        env:
          TAG: ${{ github.event.release.tag_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          helm lint charts/kletka --strict --set api.secret.existingSecret=ci
          helm package charts/kletka --version "$version" --app-version "$TAG" -d dist
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for attempt in 1 2 3 4 5; do
            if helm push "dist/kletka-${version}.tgz" "oci://ghcr.io/${IMAGE_OWNER}/charts"; then
              exit 0
            fi
            echo "helm push failed (attempt ${attempt}/5); retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          echo "helm push failed after 5 attempts" >&2
          exit 1
