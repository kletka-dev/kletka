{{- if .Values.imageBuilder.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kletka.builderName" . }}-definitions
  namespace: {{ .Values.namespaces.imageBuilder }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.builderName" . }}
data:
  images.json: |
    {{- include "kletka.guestImageDefinitions" . | nindent 4 }}
{{- end }}
