{{- $oauth := .Values.api.auth.oauth }}
{{- if not .Values.api.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kletka.apiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.apiName" . }}
type: Opaque
stringData:
  KLETKA_ADMIN_TOKEN: {{ required "api.secret.adminToken is required (or set api.secret.existingSecret)" .Values.api.secret.adminToken | quote }}
  {{- if .Values.api.database.url }}
  KLETKA_DATABASE_URL: {{ .Values.api.database.url | quote }}
  {{- end }}
  {{- if $oauth.github.enabled }}
  KLETKA_OAUTH_GITHUB_CLIENT_ID: {{ required "api.auth.oauth.github.clientId is required" $oauth.github.clientId | quote }}
  KLETKA_OAUTH_GITHUB_CLIENT_SECRET: {{ required "api.auth.oauth.github.clientSecret is required" $oauth.github.clientSecret | quote }}
  {{- end }}
  {{- if $oauth.gitlab.enabled }}
  KLETKA_OAUTH_GITLAB_CLIENT_ID: {{ required "api.auth.oauth.gitlab.clientId is required" $oauth.gitlab.clientId | quote }}
  KLETKA_OAUTH_GITLAB_CLIENT_SECRET: {{ required "api.auth.oauth.gitlab.clientSecret is required" $oauth.gitlab.clientSecret | quote }}
  {{- end }}
  {{- if $oauth.steam.enabled }}
  {{- if $oauth.steam.apiKey }}
  KLETKA_OAUTH_STEAM_API_KEY: {{ $oauth.steam.apiKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
