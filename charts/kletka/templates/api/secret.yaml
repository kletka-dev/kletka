{{- if not .Values.api.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kletka.apiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.apiName" . }}
type: Opaque
stringData:
  KLETKA_ADMIN_TOKEN: {{ required "api.secret.adminToken is required (or set api.secret.existingSecret)" .Values.api.secret.adminToken | quote }}
  {{- if .Values.api.database.url }}
  KLETKA_DATABASE_URL: {{ .Values.api.database.url | quote }}
  {{- end }}
{{- end }}
