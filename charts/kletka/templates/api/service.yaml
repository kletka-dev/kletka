apiVersion: v1
kind: Service
metadata:
  name: {{ include "kletka.apiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.apiName" . }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "kletka.apiName" . }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http }
