{{- if and (not .Values.api.persistence.existingClaim) (not .Values.api.database.external) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kletka.apiName" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.apiName" . }}
  {{- with include "kletka.keepAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.api.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
{{- end }}
