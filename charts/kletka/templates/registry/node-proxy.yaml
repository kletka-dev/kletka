{{- if and .Values.registry.enabled .Values.registry.nodeProxy.enabled }}
{{- $port := .Values.registry.nodeProxy.port }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kletka.registryName" . }}-node-proxy
  namespace: {{ .Values.namespaces.node }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
data:
  nginx.conf: |
    {{- include "kletka.nodeProxyConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kletka.registryName" . }}-node-proxy
  namespace: {{ .Values.namespaces.node }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.registryName" . }}-node-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kletka.registryName" . }}-node-proxy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kletka.registryName" . }}-node-proxy
      annotations:
        checksum/config: {{ include "kletka.nodeProxyConf" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      {{- with .Values.vms.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: {{ .Values.vms.taintKey }}
          operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: {{ include "kletka.image" (dict "image" .Values.registry.nodeProxy.image "root" .) }}
          imagePullPolicy: {{ .Values.registry.nodeProxy.image.pullPolicy }}
          command: ["nginx", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { host: 127.0.0.1, port: {{ $port }} }
          livenessProbe:
            tcpSocket: { host: 127.0.0.1, port: {{ $port }} }
            initialDelaySeconds: 10
          {{- with .Values.registry.nodeProxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "kletka.registryName" . }}-node-proxy
        - name: tmp
          emptyDir: {}
{{- end }}
