{{- if .Values.registry.enabled }}
{{- include "kletka.checkGcWindow" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kletka.registryName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.registryName" . }}
    kletka.dev/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kletka.registryName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kletka.registryName" . }}
        kletka.dev/component: registry
      annotations:
        checksum/config: {{ include "kletka.registryConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: {{ include "kletka.image" (dict "image" .Values.registry.image "root" .) }}
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          command: ["registry"]
          args: ["serve", "/etc/kletka-registry/config.yml"]
          env:
            - { name: OTEL_TRACES_EXPORTER, value: none }
          ports:
            - { name: registry, containerPort: {{ .Values.registry.port }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: config, mountPath: /etc/kletka-registry, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /v2/, port: registry }
          livenessProbe:
            httpGet: { path: /v2/, port: registry }
            initialDelaySeconds: 10
          {{- with .Values.registry.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.registry.garbageCollect.enabled }}
        - name: garbage-collect
          image: {{ include "kletka.image" (dict "image" .Values.registry.image "root" .) }}
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              last=""
              while true; do
                if [ "$(date -u +%H)" = "$GC_HOUR" ] && [ "$last" != "$(date -u +%F)" ]; then
                  last="$(date -u +%F)"
                  if find /var/lib/registry -path '*/_uploads/*' 2>/dev/null | grep -q .; then
                    echo "upload in progress; skipping garbage collection today"
                  else
                    registry garbage-collect --delete-untagged /etc/kletka-registry/config.yml \
                      || echo "garbage collection failed"
                  fi
                fi
                sleep 300
              done
          env:
            - { name: OTEL_TRACES_EXPORTER, value: none }
            - { name: GC_HOUR, value: {{ printf "%02d" (int .Values.registry.garbageCollect.hourUTC) | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: config, mountPath: /etc/kletka-registry, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: "1", memory: 512Mi }
        {{- end }}
      {{- with .Values.registry.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.registry.persistence.existingClaim | default (include "kletka.registryName" .) }}
        - name: config
          configMap:
            name: {{ include "kletka.registryName" . }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kletka.registryName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.registryName" . }}
data:
  config.yml: |
    {{- include "kletka.registryConfig" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kletka.registryName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.registryName" . }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kletka.registryName" . }}
  ports:
    - { name: registry, port: {{ .Values.registry.port }}, targetPort: registry }
{{- end }}
