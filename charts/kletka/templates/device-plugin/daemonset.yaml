{{- if .Values.devicePlugin.enabled }}
{{- $d := .Values.devicePlugin }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kletka.devicePluginName" . }}
  namespace: {{ .Values.namespaces.node }}
  labels:
    {{- include "kletka.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kletka.devicePluginName" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kletka.devicePluginName" . }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kletka.devicePluginName" . }}
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      {{- with .Values.vms.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: {{ .Values.vms.taintKey }}
          operator: Exists
      initContainers:
        - name: kvm-perms
          image: {{ include "kletka.image" (dict "image" $d.initImage "root" .) }}
          imagePullPolicy: {{ $d.initImage.pullPolicy }}
          command: ["sh", "-c", "chmod 0666 /dev/kvm || true"]
          volumeMounts:
            - { name: dev, mountPath: /dev }
      containers:
        - name: generic-device-plugin
          image: {{ include "kletka.image" (dict "image" $d.image "root" .) }}
          imagePullPolicy: {{ $d.image.pullPolicy }}
          args:
            - --domain=kletka.dev
            - --device={"name":"kvm","groups":[{"count":{{ $d.slots }},"paths":[{"path":"/dev/kvm"}]}]}
            - --device={"name":"tun","groups":[{"count":{{ $d.slots }},"paths":[{"path":"/dev/net/tun"}]}]}
          securityContext:
            privileged: true
          {{- with $d.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: device-plugins, mountPath: /var/lib/kubelet/device-plugins }
            - { name: dev, mountPath: /dev }
      volumes:
        - name: device-plugins
          hostPath: { path: /var/lib/kubelet/device-plugins, type: Directory }
        - name: dev
          hostPath: { path: /dev, type: Directory }
{{- end }}
