[workspace]
members = ["src/kletka", "src/kletka_cli", "src/kletka_types", "src/kletka_control", "src/kletka_runtime", "src/kletka_vm_agent", "src/kletka_image_builder"]
resolver = "3"
package.edition = "2024"
package.version = "0.0.1"

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
askama = { version = "0.16.1" }
thiserror = { version = "2.0.21" }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34" }
http-body-util = { version = "0.1.5" }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream", "query", "form"] }
sha2 = { version = "0.11.2" }
hex = { version = "0.4.3" }
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.9.1", features = ["sqlite", "postgres", "any", "runtime-tokio", "macros"] }
tower = { version = "0.5", features = ["util"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
rand = { version = "0.10.4" }
rust_embed = { version = "8.14.0", package = "rust-embed" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154" }
fslock = { version = "0.2.1" }
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = { version = "4.6.12" }
inquire = { version = "0.9.5" }
crossterm = { version = "0.29.0" }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "signal",
    "time",
    "fs",
    "process",
] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
